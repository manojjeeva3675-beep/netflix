<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <!-- LOGO -->
        <div class="logo">
            NETFLIX
        </div>

        <!-- LOGIN BOX -->
        <div class="login-box">

            <h1>Sign In</h1>

            <form>

                <input
                    type="text"
                    placeholder="Email or mobile number"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

                <div class="or">
                    OR
                </div>

                <button type="button" class="code-btn">
                    Use a sign-in code
                </button>

                <a href="#" class="forgot">
                    Forgot password?
                </a>

                <div class="remember">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>
                </div>

                <div class="signup">
                    <span>New to Netflix?</span>
                    <a href="#">Sign up now.</a>
                </div>

                <p class="captcha">
                    This page is protected by Google reCAPTCHA
                    to ensure you're not a bot.
                </p>

            </form>

        </div>

    </div>

</body>
</html>
