 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Logout</title>
    <link rel="stylesheet" href="log.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">NETFLIX</div>

        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="settings.html">Settings</a>
        </div>
    </nav>


    <!-- LOGOUT BOX -->
    <main class="logout-container">

        <div class="logout-box">

            <div class="logout-icon">⏻</div>

            <h1>Are you sure?</h1>

            <p>
                Do you want to log out from your Netflix account?
            </p>

            <div class="buttons">

                <a href="http://127.0.0.1:5500/login.html" class="logout-btn">
                    Login
                </a>

                <a href="settings.html" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">NETFLIX</div>

        <div class="footer-links">
            <a href="#">FAQ</a>
            <a href="#">Help Center</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact Us</a>
        </div>

        <p>© 2026 Netflix Style Media Website</p>

    </footer>

</body>
</html>
